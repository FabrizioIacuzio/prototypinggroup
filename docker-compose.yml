version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      # Persist SQLite DB and any runtime data across container restarts
      - sqlite_data:/app/data
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
